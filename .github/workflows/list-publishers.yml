name: List Data Studio Publishers (investigation)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers and Japanese fonts
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get install -y fonts-noto-cjk

      - name: Run list-publishers script
        run: node list-publishers.js

      - name: Upload publisher list debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-list-debug
          path: /tmp/publisher-list*
          if-no-files-found: ignore
