name: Download Data Studio PDFs

on:
  schedule:
    - cron: '17 0 1-9 * *'  # 毎月1〜9日 00:17 UTC（JST09:17頃）に判定し、第三営業日のみ実際に実行。00:00 UTCは他リポジトリのcronが集中し遅延しやすいため17分ずらしている
  workflow_dispatch:    # 手動実行用（第三営業日判定はスキップし、常に実行する）
    inputs:
      test_publishers:
        description: '動作確認用に絞り込む媒体名（カンマ区切り、空なら全媒体）'
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Check if today is the 3rd business day (JST)
        id: bizday
        run: echo "run_today=$(node check-business-day.js)" >> "$GITHUB_OUTPUT"

      - name: Restore Redash session
        if: github.event_name == 'schedule' && steps.bizday.outputs.run_today == 'true'
        env:
          REDASH_SESSION_STATE_B64: ${{ secrets.REDASH_SESSION_STATE_B64 }}
        run: |
          mkdir -p auth
          echo "$REDASH_SESSION_STATE_B64" | base64 -d > auth/redash-session.json

      - name: Update monthly sheets
        if: github.event_name == 'schedule' && steps.bizday.outputs.run_today == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SHEETS_REFRESH_TOKEN: ${{ secrets.GOOGLE_SHEETS_REFRESH_TOKEN }}
          SKIP_CONFIRM: 'true'
        run: node update-monthly-sheets.js

      - name: Install Playwright browsers and Japanese fonts
        if: github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true'
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get install -y fonts-noto-cjk

      - name: Restore Google session
        if: github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true'
        env:
          GOOGLE_SESSION_STATE_B64: ${{ secrets.GOOGLE_SESSION_STATE_B64 }}
        run: |
          mkdir -p auth
          echo "$GOOGLE_SESSION_STATE_B64" | base64 -d > auth/google-session.json

      - name: Run download script
        id: download
        if: github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TEST_PUBLISHERS: ${{ inputs.test_publishers }}
          KEEP_LOCAL_PDF: 'true'
        run: |
          set -o pipefail
          npm start 2>&1 | tee /tmp/download.log

      - name: Trigger GAS①（リネーム・Box転送）
        if: github.event_name == 'schedule' && steps.bizday.outputs.run_today == 'true' && steps.download.outcome == 'success'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GAS1_WEBAPP_URL: ${{ secrets.GAS1_WEBAPP_URL }}
          GAS1_TRIGGER_SECRET: ${{ secrets.GAS1_TRIGGER_SECRET }}
        run: |
          # GAS①のWebアプリは「SmartNews, Inc内の全員」デプロイのみ選択可能（Workspace管理者ポリシー）
          # のため、未認証の素のPOSTは401で拒否される。既存のDriveアップロード用Google OAuth
          # クレデンシャル（smartnews.comドメインの実ユーザー）でアクセストークンを発行し、
          # Bearerトークンとして付与することでドメイン制限を通過させる。
          ACCESS_TOKEN=$(curl -sS --max-time 20 -X POST https://oauth2.googleapis.com/token \
            -d client_id="$GOOGLE_CLIENT_ID" \
            -d client_secret="$GOOGLE_CLIENT_SECRET" \
            -d refresh_token="$GOOGLE_REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "⚠️ GAS①起動用アクセストークンの発行に失敗しました（低頻度の時間主導トリガーがフォールバックとして拾います）"
          else
            curl -sS --max-time 30 -X POST "$GAS1_WEBAPP_URL" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"secret\":\"$GAS1_TRIGGER_SECRET\"}" \
              || echo "⚠️ GAS①へのプッシュ起動に失敗しました（低頻度の時間主導トリガーがフォールバックとして拾います）"
          fi

      - name: Upload debug artifacts
        if: always() && (github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: data-studio-debug
          path: /tmp/*.debug.*
          if-no-files-found: ignore

      - name: Upload generated PDFs (temporary, for manual verification)
        if: always() && (github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: data-studio-pdfs
          path: /tmp/*.pdf
          if-no-files-found: ignore

      - name: Notify Slack
        if: always() && github.event_name == 'schedule' && steps.bizday.outputs.run_today == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: node notify-slack.js
