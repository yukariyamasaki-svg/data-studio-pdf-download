name: Download Data Studio PDFs

on:
  schedule:
    - cron: '0 0 3 * *'  # 毎月3日 00:00 UTC
  workflow_dispatch:    # 手動実行用

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers and Japanese fonts
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get install -y fonts-noto-cjk

      - name: Run download script
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          KEEP_LOCAL_PDF: 'true'
        run: npm start

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-studio-debug
          path: /tmp/*.debug.*
          if-no-files-found: ignore

      - name: Upload generated PDFs (temporary, for manual verification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-studio-pdfs
          path: /tmp/*.pdf
          if-no-files-found: ignore
