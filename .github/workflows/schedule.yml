name: Download Data Studio PDFs

on:
  schedule:
    - cron: '0 0 1-9 * *'  # 毎月1〜9日 00:00 UTC（JST09:00）に判定し、第三営業日のみ実際に実行
  workflow_dispatch:    # 手動実行用（第三営業日判定はスキップし、常に実行する）
    inputs:
      test_publishers:
        description: '動作確認用に絞り込む媒体名（カンマ区切り、空なら全媒体）'
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Check if today is the 3rd business day (JST)
        id: bizday
        run: echo "run_today=$(node check-business-day.js)" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browsers and Japanese fonts
        if: github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true'
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get install -y fonts-noto-cjk

      - name: Run download script
        id: download
        if: github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TEST_PUBLISHERS: ${{ inputs.test_publishers }}
          KEEP_LOCAL_PDF: 'true'
        run: |
          set -o pipefail
          npm start 2>&1 | tee /tmp/download.log

      - name: Upload debug artifacts
        if: always() && (github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: data-studio-debug
          path: /tmp/*.debug.*
          if-no-files-found: ignore

      - name: Upload generated PDFs (temporary, for manual verification)
        if: always() && (github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: data-studio-pdfs
          path: /tmp/*.pdf
          if-no-files-found: ignore

      - name: Notify Slack
        if: always() && (github.event_name == 'workflow_dispatch' || steps.bizday.outputs.run_today == 'true')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: node notify-slack.js
